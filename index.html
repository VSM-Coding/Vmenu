<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Рецептник</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-hover: #fa5252;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #343a40;
            --border: #dee2e6;
            --success: #51cf66;
            --accent: #ff922b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }

        /* Навигация */
        nav { background: var(--card-bg); padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; display: flex; justify-content: center; gap: 20px; }
        nav button { background: none; border: none; font-size: 16px; font-weight: bold; color: #868e96; cursor: pointer; padding: 5px 10px; border-bottom: 3px solid transparent; transition: 0.3s; }
        nav button.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        /* Основной контейнер */
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; display: none; }
        .container.active { display: block; }

        /* Кнопки */
        .btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 15px; transition: 0.2s; font-weight: bold; }
        .btn:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-small { padding: 6px 12px; font-size: 13px; border-radius: 6px; }
        .btn-block { width: 100%; display: block; text-align: center; }

        /* Поиск и категории */
        .search-box { width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 15px; outline: none; }
        .category-filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; }
        .cat-btn { background: #e9ecef; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: var(--primary); color: white; }

        /* Карточки рецептов */
        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-top: 10px; }
        .recipe-card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; border: 1px solid var(--border); position: relative; display: flex; flex-direction: column; justify-content: space-between; height: 180px; }
        .recipe-card:hover { transform: translateY(-3px); }
        .recipe-card h3 { margin-bottom: 5px; font-size: 18px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-meta { font-size: 13px; color: #868e96; display: flex; gap: 10px; margin-top: 5px; }
        
        /* План на неделю */
        .week-grid { display: grid; gap: 15px; margin-top: 15px; }
        .day-card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .day-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 5px; display: flex; justify-content: space-between; }
        .meal-slot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .meal-slot select { padding: 8px; border-radius: 6px; border: 1px solid var(--border); width: 65%; font-size: 14px; }

        /* Порции */
        .portions-control { display: flex; align-items: center; gap: 10px; background: #f1f3f5; padding: 5px 10px; border-radius: 20px; width: fit-content; margin: 10px 0; }
        .portions-control button { background: white; border: none; font-size: 16px; font-weight: bold; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        /* Список покупок */
        .shopping-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1001; }
        .shopping-modal { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .shopping-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 15px; }
        .shopping-item input[type="checkbox"] { transform: scale(1.2); }
        .shopping-item.checked { text-decoration: line-through; color: #adb5bd; }

        /* Режим готовки (Таймеры) */
        .cooking-view { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .step-item { border-left: 4px solid var(--primary); padding-left: 15px; margin-bottom: 20px; }
        .timer-box { display: flex; align-items: center; gap: 15px; margin-top: 10px; background: var(--bg); padding: 10px; border-radius: 8px; }
        .time-display { font-size: 20px; font-weight: bold; font-family: monospace; min-width: 70px; }
        
        /* Модальное окно (Добавление рецепта) */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; outline: none; }
        .dynamic-list-item { display: flex; gap: 8px; margin-bottom: 8px; }
        .dynamic-list-item input { flex: 1; }

    </style>
</head>
<body>

    <!-- Навигация -->
    <nav>
        <button class="active" onclick="switchTab('recipes')">📒 Мои рецепты</button>
        <button onclick="switchTab('plan')">📅 Меню на неделю</button>
        <button onclick="switchTab('cook')" id="nav-cook" style="display:none;">🍳 Готовка</button>
    </nav>

    <!-- Вкладка: Мои Рецепты -->
    <div id="recipes-tab" class="container active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>Кулинарная книга</h2>
            <div>
                <button class="btn btn-outline btn-small" onclick="exportImportData()">🔄 Импорт</button>
                <button class="btn btn-small" onclick="openModal()">+ Новый</button>
            </div>
        </div>
        
        <input type="text" id="search-input" class="search-box" placeholder="Поиск по названию или ингредиентам..." oninput="filterRecipes()">
        
        <div class="category-filters">
            <button class="cat-btn active" onclick="filterCategory('все', this)">Все</button>
            <button class="cat-btn" onclick="filterCategory('Завтрак', this)">🥞 Завтраки</button>
            <button class="cat-btn" onclick="filterCategory('Обед', this)">🍲 Обеды</button>
            <button class="cat-btn" onclick="filterCategory('Ужин', this)">🥩 Ужины</button>
            <button class="cat-btn" onclick="filterCategory('Выпечка', this)">🍰 Выпечка</button>
        </div>

        <div id="recipe-list" class="recipe-grid">
            <!-- Рецепты рендерятся здесь -->
        </div>
    </div>

    <!-- Вкладка: План на неделю -->
    <div id="plan-tab" class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>Меню на неделю</h2>
            <button class="btn btn-small btn-outline" style="border-color: var(--accent); color: var(--accent);" onclick="generateShoppingList()">🛒 Список покупок</button>
        </div>
        <div id="week-list" class="week-grid">
            <!-- Дни недели рендерятся здесь -->
        </div>
    </div>

    <!-- Вкладка: Режим готовки -->
    <div id="cook-tab" class="container">
        <div id="cook-view" class="cooking-view">
            <!-- Интерфейс готовки рендерится здесь -->
        </div>
    </div>

    <!-- Оверлей списка покупок -->
    <div id="shopping-overlay" class="shopping-overlay" onclick="closeShoppingModal()">
        <div class="shopping-modal" onclick="event.stopPropagation()">
            <h2 style="margin-bottom: 15px; color: var(--primary);">🛒 Список покупок</h2>
            <div id="shopping-list-content"></div>
            <button class="btn btn-block" style="margin-top: 20px;" onclick="closeShoppingModal()">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно создания рецепта -->
    <div id="recipe-modal" class="modal-overlay">
        <div class="modal">
            <h2 id="modal-title" style="margin-bottom: 15px;">Новый рецепт</h2>
            <div class="form-group">
                <input type="text" id="r-name" placeholder="Название блюда (например, Паста Карбонара)" required>
            </div>
            
            <div class="form-group">
                <label>Категория</label>
                <select id="r-category">
                    <option value="Обед">🍲 Обед</option>
                    <option value="Завтрак">🥞 Завтрак</option>
                    <option value="Ужин">🥩 Ужин</option>
                    <option value="Выпечка">🍰 Выпечка / Десерты</option>
                </select>
            </div>

            <div class="form-group">
                <label>Кол-во порций по умолчанию</label>
                <input type="number" id="r-servings" value="2" min="1">
            </div>
            
            <div class="form-group">
                <label>Ингредиенты (Пиши кол-во числом, чтобы масштабировать, например: Мука - 200 г)</label>
                <div id="ingredients-container">
                    <div class="dynamic-list-item"><input type="text" class="ing-input" placeholder="Мука - 200 г"></div>
                </div>
                <button class="btn btn-small btn-outline" style="margin-top: 5px;" onclick="addIngredientField()">+ Ингредиент</button>
            </div>

            <div class="form-group">
                <label>Шаги готовки и таймеры</label>
                <div id="steps-container">
                    <div class="dynamic-list-item">
                        <input type="text" class="step-desc" placeholder="Описание шага">
                        <input type="number" class="step-time" placeholder="Минут" min="0" style="max-width: 90px;">
                    </div>
                </div>
                <button class="btn btn-small btn-outline" style="margin-top: 5px;" onclick="addStepField()">+ Шаг</button>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" style="flex: 1;" onclick="saveRecipe()">Сохранить</button>
                <button class="btn btn-outline" style="flex: 1;" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // --- Базовые заготовленные рецепты для первого запуска ---
        const defaultRecipes = [
            {
                id: "1",
                name: "🔥 Пышные сырники",
                category: "Завтрак",
                servings: 2,
                ingredients: ["Творог 9% - 400 г", "Яйцо - 1 шт", "Сахар - 2 ст. л.", "Мука пшеничная - 3 ст. л.", "Растительное масло - 2 ст. л.", "Соль - 1 щепотка"],
                steps: [
                    { desc: "Разомните творог вилкой в миске. Добавьте яйцо, сахар и щепотку соли, тщательно перемешайте.", time: 5 },
                    { desc: "Всыпьте муку и еще раз перемешайте, чтобы получилось мягкое, слегка липкое тесто.", time: 5 },
                    { desc: "Сформируйте небольшие круглые сырники и обваляйте их в муке.", time: 7 },
                    { desc: "Разогрейте сковороду с маслом и обжаривайте сырники на среднем огне до золотистой корочки с каждой стороны.", time: 10 }
                ]
            },
            {
                id: "2",
                name: "🍝 Классическая карбонара",
                category: "Ужин",
                servings: 2,
                ingredients: ["Спагетти - 200 г", "Бекон или грудинка - 100 г", "Сыр пармезан - 50 г", "Желтки яичные - 3 шт", "Чеснок - 1 зубчик", "Соль - 1 ч. л.", "Черный перец - по вкусу"],
                steps: [
                    { desc: "Поставьте вариться спагетти в кипящей соленой воде на 1 минуту меньше времени, указанного на пачке.", time: 9 },
                    { desc: "Нарежьте бекон кубиками и обжарьте на сковороде с раздавленным зубчиком чеснока (чеснок потом убрать).", time: 6 },
                    { desc: "Смешайте в миске яичные желтки, мелко натертый сыр и молотый перец.", time: 4 },
                    { desc: "Добавьте горячие спагетти в сковороду к бекону, снимите сковороду с огня, влейте яично-сырную смесь и быстро перемешайте, чтобы соус загустел.", time: 3 }
                ]
            }
        ];

        // --- Управление состоянием (State) ---
        let recipes = JSON.parse(localStorage.getItem('my_recipes')) || defaultRecipes;
        if (recipes.length === 0) recipes = defaultRecipes;

        let weekPlan = JSON.parse(localStorage.getItem('week_plan')) || {
            'Понедельник': {b: '', l: '', d: ''}, 'Вторник': {b: '', l: '', d: ''},
            'Среда': {b: '', l: '', d: ''}, 'Четверг': {b: '', l: '', d: ''},
            'Пятница': {b: '', l: '', d: ''}, 'Суббота': {b: '', l: '', d: ''}, 'Воскресенье': {b: '', l: '', d: ''}
        };
        
        let activeTimers = {}; 
        let currentCookingRecipe = null;
        let currentPortions = 1;
        let activeCategory = 'все';

        const days = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
        const meals = { b: '🥞 Завтрак', l: '🍲 Обед', d: '🥩 Ужин' };

        // Инициализация
        renderRecipes();
        renderWeekPlan();

        // --- Навигация ---
        function switchTab(tabId) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`${tabId}-tab`).classList.add('active');
            
            const btn = Array.from(document.querySelectorAll('nav button')).find(b => b.onclick.toString().includes(tabId));
            if (btn) btn.classList.add('active');
            
            if (tabId !== 'cook') {
                document.getElementById('nav-cook').style.display = 'none';
                clearAllTimers();
            }
        }

        // --- Работа с рецептами ---
        function openModal() { document.getElementById('recipe-modal').style.display = 'flex'; }
        
        function closeModal() { 
            document.getElementById('recipe-modal').style.display = 'none';
            document.getElementById('r-name').value = '';
            document.getElementById('r-category').value = 'Обед';
            document.getElementById('r-servings').value = '2';
            document.getElementById('ingredients-container').innerHTML = '<div class="dynamic-list-item"><input type="text" class="ing-input" placeholder="Мука - 200 г"></div>';
            document.getElementById('steps-container').innerHTML = '<div class="dynamic-list-item"><input type="text" class="step-desc" placeholder="Описание шага"><input type="number" class="step-time" placeholder="Минут" min="0" style="max-width: 90px;"></div>';
        }

        function addIngredientField() {
            document.getElementById('ingredients-container').insertAdjacentHTML('beforeend', '<div class="dynamic-list-item"><input type="text" class="ing-input" placeholder="Ингредиент - количество"></div>');
        }

        function addStepField() {
            document.getElementById('steps-container').insertAdjacentHTML('beforeend', '<div class="dynamic-list-item"><input type="text" class="step-desc" placeholder="Описание шага"><input type="number" class="step-time" placeholder="Минут" min="0" style="max-width: 90px;"></div>');
        }

        function saveRecipe() {
            const name = document.getElementById('r-name').value.trim();
            const category = document.getElementById('r-category').value;
            const servings = parseInt(document.getElementById('r-servings').value) || 2;
            
            if (!name) return alert("Введите название рецепта!");

            const ingredients = Array.from(document.querySelectorAll('.ing-input')).map(i => i.value.trim()).filter(i => i);
            
            const steps = Array.from(document.querySelectorAll('#steps-container .dynamic-list-item')).map(div => {
                const desc = div.querySelector('.step-desc').value.trim();
                const time = parseInt(div.querySelector('.step-time').value) || 0;
                return desc ? { desc, time } : null;
            }).filter(s => s);

            const newRecipe = {
                id: Date.now().toString(),
                name, category, servings, ingredients, steps
            };

            recipes.push(newRecipe);
            localStorage.setItem('my_recipes', JSON.stringify(recipes));
            
            renderRecipes();
            renderWeekPlan();
            closeModal();
        }

        function deleteRecipe(id) {
            if(confirm("Удалить этот рецепт навсегда?")) {
                recipes = recipes.filter(r => r.id !== id);
                localStorage.setItem('my_recipes', JSON.stringify(recipes));
                renderRecipes();
                renderWeekPlan();
            }
        }

        // --- Отрисовка & Фильтрация ---
        function renderRecipes() {
            const list = document.getElementById('recipe-list');
            list.innerHTML = '';
            
            const search = document.getElementById('search-input').value.toLowerCase();

            recipes.forEach(r => {
                const searchMatch = r.name.toLowerCase().includes(search) || r.ingredients.some(i => i.toLowerCase().includes(search));
                const catMatch = activeCategory === 'все' || r.category === activeCategory;

                if (searchMatch && catMatch) {
                    const totalTime = r.steps.reduce((sum, s) => sum + s.time, 0);
                    list.insertAdjacentHTML('beforeend', `
                        <div class="recipe-card" onclick="startCooking('${r.id}')">
                            <div>
                                <span style="font-size: 11px; font-weight: bold; padding: 3px 8px; background: #e9ecef; border-radius: 12px; color: #495057;">${r.category}</span>
                                <h3 style="margin-top: 8px;">${r.name}</h3>
                            </div>
                            <div>
                                <div class="card-meta">
                                    <span>⏱ ~${totalTime} мин.</span>
                                    <span>🥗 ${r.ingredients.length} ингред.</span>
                                </div>
                                <button class="btn btn-small btn-outline" style="margin-top: 10px; border-color: red; color: red;" onclick="event.stopPropagation(); deleteRecipe('${r.id}')">🗑 Удалить</button>
                            </div>
                        </div>
