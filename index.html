<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <title>Мои Рецепты</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-2: #2a2a2a;
      --accent: #ff7043;
      --accent-hover: #ff8a65;
      --text: #f5f5f5;
      --text-muted: #9e9e9e;
      --border: #333333;
      --success: #66bb6a;
      --danger: #ef5350;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(18, 18, 18, 0.94);
      backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-danger {
      background: rgba(239, 83, 80, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 83, 80, 0.35);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .search-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 15px;
      margin-bottom: 10px;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--accent);
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    main {
      padding: 14px 16px;
      max-width: 720px;
      margin: 0 auto;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      color: var(--text-muted);
    }

    .empty-state p {
      margin: 8px 0 16px;
      line-height: 1.5;
    }

    .recipe-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .recipe-card:active {
      transform: scale(0.99);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge {
      background: var(--surface-2);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .kbju-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
    }

    .kbju-item span {
      display: block;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }

    .kbju-item small {
      color: var(--text-muted);
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 2px 4px;
    }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
      z-index: 20;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px;
    }

    .nav-item.active {
      color: var(--accent);
      font-weight: 600;
    }

    .nav-item span.icon {
      font-size: 19px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 50;
      display: none;
      overflow-y: auto;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: block;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 640px;
      margin: 0 auto 30px;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .close-btn {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .section-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 18px 0 10px;
    }

    .ing-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ing-list li {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }

    .step-card {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--accent);
    }

    .timer-btn {
      background: rgba(255, 112, 67, 0.16);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .timer-btn.running {
      background: var(--success);
      border-color: var(--success);
      color: #121212;
    }

    /* Forms */
    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .row-item {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .cart-item.checked {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .day-summary {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

<header id="app-header">
  <div class="header-top">
    <h1 id="page-title">📖 Рецепты</h1>
    <div class="header-actions">
      <button class="btn-icon" onclick="openBackupModal()">💾 Бэкап</button>
      <button class="btn-primary" onclick="openEditModal()">+ Рецепт</button>
    </div>
  </div>
  <div id="search-controls">
    <input type="text" id="search-input" class="search-box" placeholder="Поиск по названию или ингредиенту..." oninput="renderCurrentTab()" />
    <div class="chips" id="category-chips"></div>
  </div>
</header>

<main id="main-content"></main>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="recipes" onclick="switchTab('recipes')">
    <span class="icon">🍳</span>
    <span>Рецепты</span>
  </button>
  <button class="nav-item" data-tab="favorites" onclick="switchTab('favorites')">
    <span class="icon">⭐</span>
    <span>Избранное</span>
  </button>
  <button class="nav-item" data-tab="planner" onclick="switchTab('planner')">
    <span class="icon">📅</span>
    <span>Меню дня</span>
  </button>
  <button class="nav-item" data-tab="cart" onclick="switchTab('cart')">
    <span class="icon">🛒</span>
    <span>Покупки</span>
  </button>
</nav>

<!-- Модалка просмотра рецепта -->
<div class="modal-backdrop" id="view-modal">
  <div class="modal" id="view-modal-body"></div>
</div>

<!-- Модалка создания/редактирования рецепта -->
<div class="modal-backdrop" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="edit-modal-title">Новый рецепт</h2>
      <button class="close-btn" onclick="closeModal('edit-modal')">✕</button>
    </div>
    <form id="recipe-form" onsubmit="saveRecipe(event)">
      <input type="hidden" id="edit-id" />
      <div class="form-group">
        <label>Название блюда</label>
        <input type="text" id="edit-title" required placeholder="Например: Поккымпаб" />
      </div>
      <div class="row-item">
        <div class="form-group" style="flex:1;">
          <label>Категория</label>
          <select id="edit-category">
            <option value="Основные блюда">Основные блюда</option>
            <option value="Завтраки">Завтраки</option>
            <option value="Перекусы">Перекусы</option>
            <option value="Салаты">Салаты</option>
            <option value="Десерты">Десерты</option>
          </select>
        </div>
        <div class="form-group" style="width:120px;">
          <label>Время (мин)</label>
          <input type="number" id="edit-time" min="1" value="20" />
        </div>
      </div>

      <div class="form-group">
        <label>КБЖУ на всё блюдо целиком</label>
        <div class="grid-4">
          <div><input type="number" id="edit-kcal" placeholder="Ккал" required /></div>
          <div><input type="number" step="0.1" id="edit-prot" placeholder="Белки" required /></div>
          <div><input type="number" step="0.1" id="edit-fat" placeholder="Жиры" required /></div>
          <div><input type="number" step="0.1" id="edit-carb" placeholder="Углев." required /></div>
        </div>
      </div>

      <div class="form-group">
        <label>Ингредиенты</label>
        <div id="edit-ingredients"></div>
        <button type="button" class="btn-secondary" onclick="addIngredientRow()">+ Добавить ингредиент</button>
      </div>

      <div class="form-group">
        <label>Шаги приготовления (таймер в секундах, опционально)</label>
        <div id="edit-steps"></div>
        <button type="button" class="btn-secondary" onclick="addStepRow()">+ Добавить шаг</button>
      </div>

      <div style="display:flex; gap:10px; margin-top:18px;">
        <button type="submit" class="btn-primary" style="flex:1;">Сохранить рецепт</button>
        <button type="button" class="btn-secondary" onclick="closeModal('edit-modal')">Отмена</button>
      </div>
    </form>
  </div>
</div>

<!-- Модалка Бэкапа (JSON) -->
<div class="modal-backdrop" id="backup-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>💾 База рецептов (JSON)</h2>
      <button class="close-btn" onclick="closeModal('backup-modal')">✕</button>
    </div>
    <p style="font-size:14px; color:var(--text-muted); line-height:1.5;">
      Рецепты хранятся только локально в памяти этого браузера. Используй JSON-файл или текст ниже для переноса между устройствами.
    </p>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
      <button class="btn-primary" onclick="exportJSONFile()">⬇️ Скачать recipes.json</button>
      <button class="btn-secondary" onclick="copyJSONText()">📋 Скопировать JSON</button>
      <label class="btn-secondary" style="cursor:pointer;">
        📂 Загрузить файл
        <input type="file" accept=".json,application/json" style="display:none;" onchange="importJSONFile(event)" />
      </label>
    </div>
    <div class="form-group">
      <label>Вставить JSON вручную (заменит или дополнит текущую базу):</label>
      <textarea id="json-textarea" rows="7" placeholder='[{"id":"...","title":"..."}]'></textarea>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-primary" onclick="importJSONText(true)">Импорт (добавить/обновить)</button>
      <button class="btn-danger" onclick="importJSONText(false)">Заменить полностью</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'recipes_db_v1';
  const PLANNER_KEY = 'recipes_planner_v1';
  const CART_KEY = 'recipes_cart_v1';

  // Пустая стартовая база — репозиторий на GitHub не содержит личных рецептов
  const defaultRecipes = [];

  let recipes = [];
  let plannerIds = [];
  let cartItems = [];
  let currentTab = 'recipes';
  let selectedCategory = 'Все';
  let activeTimers = {};

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      recipes = saved ? JSON.parse(saved) : [...defaultRecipes];
      plannerIds = JSON.parse(localStorage.getItem(PLANNER_KEY) || '[]');
      cartItems = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
    } catch (e) {
      recipes = [...defaultRecipes];
      plannerIds = [];
      cartItems = [];
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes));
    localStorage.setItem(PLANNER_KEY, JSON.stringify(plannerIds));
    localStorage.setItem(CART_KEY, JSON.stringify(cartItems));
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    const titles = {
      recipes: '📖 Рецепты',
      favorites: '⭐ Избранное',
      planner: '📅 Меню дня',
      cart: '🛒 Список покупок'
    };
    document.getElementById('page-title').textContent = titles[tab];
    document.getElementById('search-controls').style.display = (tab === 'recipes' || tab === 'favorites') ? 'block' : 'none';
    renderCurrentTab();
  }

  function renderCategoryChips() {
    const cats = ['Все', ...new Set(recipes.map(r => r.category))];
    if (!cats.includes(selectedCategory)) selectedCategory = 'Все';
    const container = document.getElementById('category-chips');
    container.innerHTML = cats.map(c => `
      <button class="chip ${c === selectedCategory ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</button>
    `).join('');
  }

  function selectCategory(cat) {
    selectedCategory = cat;
    renderCurrentTab();
  }

  function renderCurrentTab() {
    renderCategoryChips();
    const main = document.getElementById('main-content');

    if (currentTab === 'recipes' || currentTab === 'favorites') {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      let list = recipes.filter(r => {
        if (currentTab === 'favorites' && !r.favorite) return false;
        if (selectedCategory !== 'Все' && r.category !== selectedCategory) return false;
        if (query) {
          const inTitle = r.title.toLowerCase().includes(query);
          const inIng = r.ingredients.some(i => i.name.toLowerCase().includes(query));
          return inTitle || inIng;
        }
        return true;
      });

      if (list.length === 0) {
        main.innerHTML = `
          <div class="empty-state">
            <div style="font-size:36px;">🍽️</div>
            <p>${recipes.length === 0
              ? 'База рецептов пока пуста. Нажми <b>«💾 Бэкап»</b>, чтобы загрузить свой JSON-файл, или создай первый рецепт вручную.'
              : 'По выбранным фильтрам ничего не найдено.'}</p>
            <button class="btn-primary" onclick="openBackupModal()">Импортировать JSON</button>
          </div>
        `;
        return;
      }

      main.innerHTML = list.map(r => `
        <div class="recipe-card" onclick="openViewModal('${r.id}')">
          <div class="card-top">
            <div>
              <h3 class="card-title">${escapeHtml(r.title)}</h3>
              <div class="card-meta">
                <span class="badge">${escapeHtml(r.category)}</span>
                <span class="badge">⏱ ${r.time} мин</span>
                <span class="badge">🥗 ${r.ingredients.length} ингр.</span>
              </div>
            </div>
            <button class="fav-btn" onclick="toggleFavorite(event, '${r.id}')">${r.favorite ? '⭐' : '☆'}</button>
          </div>
          <div class="kbju-bar">
            <div class="kbju-item"><span>${r.kbju.kcal}</span><small>ккал</small></div>
            <div class="kbju-item"><span>${r.kbju.prot}г</span><small>белки</small></div>
            <div class="kbju-item"><span>${r.kbju.fat}г</span><small>жиры</small></div>
            <div class="kbju-item"><span>${r.kbju.carb}г</span><small>углев.</small></div>
          </div>
        </div>
      `).join('');
    } else if (currentTab === 'planner') {
      const planned = plannerIds.map(id => recipes.find(r => r.id === id)).filter(Boolean);
      const totals = planned.reduce((acc, r) => ({
        kcal: acc.kcal + Number(r.kbju.kcal || 0),
        prot: acc.prot + Number(r.kbju.prot || 0),
        fat: acc.fat + Number(r.kbju.fat || 0),
        carb: acc.carb + Number(r.kbju.carb || 0)
      }), { kcal: 0, prot: 0, fat: 0, carb: 0 });

      main.innerHTML = `
        <div class="day-summary">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <strong>Итого за день (${planned.length} блюд)</strong>
            ${planned.length ? `<button class="btn-danger" style="padding:4px 10px; font-size:12px;" onclick="clearPlanner()">Очистить</button>` : ''}
          </div>
          <div class="kbju-bar" style="border-top:none; padding-top:0; margin-top:0;">
            <div class="kbju-item"><span>${Math.round(totals.kcal)}</span><small>ккал</small></div>
            <div class="kbju-item"><span>${totals.prot.toFixed(1)}г</span><small>белки</small></div>
            <div class="kbju-item"><span>${totals.fat.toFixed(1)}г</span><small>жиры</small></div>
            <div class="kbju-item"><span>${totals.carb.toFixed(1)}г</span><small>углев.</small></div>
          </div>
        </div>
        ${planned.length === 0 ? `
          <div class="empty-state">
            <p>В меню на день пока пусто. Открой любой рецепт и нажми «+ В меню дня».</p>
          </div>
        ` : planned.map((r, idx) => `
          <div class="recipe-card" style="display:flex; justify-content:space-between; align-items:center;">
            <div onclick="openViewModal('${r.id}')" style="flex:1;">
              <strong>${escapeHtml(r.title)}</strong>
              <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">
                ${r.kbju.kcal} ккал • Б:${r.kbju.prot} Ж:${r.kbju.fat} У:${r.kbju.carb}
              </div>
            </div>
            <button class="btn-danger" onclick="removeFromPlanner(${idx})">✕</button>
          </div>
        `).join('')}
      `;
    } else if (currentTab === 'cart') {
      main.innerHTML = `
        <div style="display:flex; gap:8px; margin-bottom:14px;">
          <input type="text" id="new-cart-input" placeholder="Добавить продукт вручную..." onkeydown="if(event.key==='Enter') addManualCartItem()" />
          <button class="btn-primary" onclick="addManualCartItem()">+</button>
        </div>
        ${cartItems.length > 0 ? `
          <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
            <button class="btn-danger" style="font-size:12px; padding:6px 10px;" onclick="clearCart()">Очистить список</button>
          </div>
        ` : ''}
        ${cartItems.length === 0 ? `
          <div class="empty-state">
            <p>Список покупок пуст. Можно добавить продукты из любого рецепта или вписать выше.</p>
          </div>
        ` : cartItems.map((item, idx) => `
          <div class="cart-item ${item.checked ? 'checked' : ''}" onclick="toggleCartItem(${idx})">
            <span>${item.checked ? '✅' : '⬜'} ${escapeHtml(item.text)}</span>
            <button class="btn-icon" style="padding:4px 8px;" onclick="event.stopPropagation(); deleteCartItem(${idx})">✕</button>
          </div>
        `).join('')}
      `;
    }
  }

  function openViewModal(id) {
    const r = recipes.find(item => item.id === id);
    if (!r) return;

    const modalBody = document.getElementById('view-modal-body');
    modalBody.innerHTML = `
      <div class="modal-header">
        <h2>${escapeHtml(r.title)}</h2>
        <button class="close-btn" onclick="closeModal('view-modal')">✕</button>
      </div>
      <div class="card-meta" style="margin-bottom:12px;">
        <span class="badge">${escapeHtml(r.category)}</span>
        <span class="badge">⏱ ${r.time} мин</span>
      </div>
      <div class="kbju-bar" style="background:var(--bg); border-radius:10px; padding:10px; border:none;">
        <div class="kbju-item"><span>${r.kbju.kcal}</span><small>ккал (всё блюдо)</small></div>
        <div class="kbju-item"><span>${r.kbju.prot}г</span><small>белки</small></div>
        <div class="kbju-item"><span>${r.kbju.fat}г</span><small>жиры</small></div>
        <div class="kbju-item"><span>${r.kbju.carb}г</span><small>углеводы</small></div>
      </div>

      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;">
        <button class="btn-primary" onclick="addToPlanner('${r.id}')">+ В меню дня</button>
        <button class="btn-secondary" onclick="addRecipeToCart('${r.id}')">🛒 В покупки</button>
        <button class="btn-secondary" onclick="closeModal('view-modal'); openEditModal('${r.id}')">✏️ Изменить</button>
        <button class="btn-danger" onclick="deleteRecipe('${r.id}')">🗑</button>
      </div>

      <div class="section-title">Ингредиенты</div>
      <ul class="ing-list">
        ${r.ingredients.map(i => `
          <li>
            <span>${escapeHtml(i.name)}</span>
            <strong>${escapeHtml(i.amount)}</strong>
          </li>
        `).join('')}
      </ul>

      <div class="section-title">Приготовление</div>
      ${r.steps.map((s, idx) => {
        const timerKey = `${r.id}_${idx}`;
        const sec = Number(s.timer || 0);
        return `
          <div class="step-card">
            <div class="step-header">
              <span>Шаг ${idx + 1}</span>
              ${sec > 0 ? `<button class="timer-btn" id="timer-${timerKey}" onclick="toggleStepTimer('${timerKey}', ${sec})">⏱ ${formatTime(sec)}</button>` : ''}
            </div>
            <div style="line-height:1.5; font-size:15px;">${escapeHtml(s.text)}</div>
          </div>
        `;
      }).join('')}
    `;
    document.getElementById('view-modal').classList.add('open');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function toggleStepTimer(key, defaultSec) {
    const btn = document.getElementById(`timer-${key}`);
    if (activeTimers[key]) {
      clearInterval(activeTimers[key].interval);
      delete activeTimers[key];
      if (btn) {
        btn.classList.remove('running');
        btn.textContent = `⏱ ${formatTime(defaultSec)}`;
      }
      return;
    }

    let remaining = defaultSec;
    if (btn) {
      btn.classList.add('running');
      btn.textContent = `⏳ ${formatTime(remaining)}`;
    }

    activeTimers[key] = {
      interval: setInterval(() => {
        remaining--;
        const el = document.getElementById(`timer-${key}`);
        if (remaining <= 0) {
          clearInterval(activeTimers[key].interval);
          delete activeTimers[key];
          if (el) {
            el.classList.remove('running');
            el.textContent = '✅ Готово!';
          }
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
          alert('Таймер шага завершён!');
        } else if (el) {
          el.textContent = `⏳ ${formatTime(remaining)}`;
        }
      }, 1000)
    };
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function toggleFavorite(e, id) {
    e.stopPropagation();
    const r = recipes.find(item => item.id === id);
    if (r) {
      r.favorite = !r.favorite;
      saveState();
      renderCurrentTab();
    }
  }

  function addToPlanner(id) {
    plannerIds.push(id);
    saveState();
    alert('Блюдо добавлено в меню дня!');
  }

  function removeFromPlanner(idx) {
    plannerIds.splice(idx, 1);
    saveState();
    renderCurrentTab();
  }

  function clearPlanner() {
    plannerIds = [];
    saveState();
    renderCurrentTab();
  }

  function addRecipeToCart(id) {
    const r = recipes.find(item => item.id === id);
    if (!r) return;
    r.ingredients.forEach(i => {
      cartItems.push({ text: `${i.name} — ${i.amount}`, checked: false });
    });
    saveState();
    alert('Ингредиенты добавлены в список покупок!');
  }

  function addManualCartItem() {
    const input = document.getElementById('new-cart-input');
    const val = input.value.trim();
    if (!val) return;
    cartItems.unshift({ text: val, checked: false });
    input.value = '';
    saveState();
    renderCurrentTab();
  }

  function toggleCartItem(idx) {
    cartItems[idx].checked = !cartItems[idx].checked;
    saveState();
    renderCurrentTab();
  }

  function deleteCartItem(idx) {
    cartItems.splice(idx, 1);
    saveState();
    renderCurrentTab();
  }

  function clearCart() {
    cartItems = [];
    saveState();
    renderCurrentTab();
  }

  function openEditModal(id = null) {
    const form = document.getElementById('recipe-form');
    form.reset();
    document.getElementById('edit-id').value = id || '';
    document.getElementById('edit-modal-title').textContent = id ? 'Редактировать рецепт' : 'Новый рецепт';
    const ingContainer = document.getElementById('edit-ingredients');
    const stepContainer = document.getElementById('edit-steps');
    ingContainer.innerHTML = '';
    stepContainer.innerHTML = '';

    if (id) {
      const r = recipes.find(item => item.id === id);
      if (r) {
        document.getElementById('edit-title').value = r.title;
        document.getElementById('edit-category').value = r.category;
        document.getElementById('edit-time').value = r.time;
        document.getElementById('edit-kcal').value = r.kbju.kcal;
        document.getElementById('edit-prot').value = r.kbju.prot;
        document.getElementById('edit-fat').value = r.kbju.fat;
        document.getElementById('edit-carb').value = r.kbju.carb;
        r.ingredients.forEach(i => addIngredientRow(i.name, i.amount));
        r.steps.forEach(s => addStepRow(s.text, s.timer || ''));
      }
    } else {
      addIngredientRow();
      addStepRow();
    }
    document.getElementById('edit-modal').classList.add('open');
  }

  function addIngredientRow(name = '', amount = '') {
    const div = document.createElement('div');
    div.className = 'row-item';
    div.innerHTML = `
      <input type="text" class="ing-name" placeholder="Продукт" value="${escapeHtml(name)}" required style="flex:2;" />
      <input type="text" class="ing-amount" placeholder="Кол-во" value="${escapeHtml(amount)}" required style="flex:1;" />
      <button type="button" class="btn-danger" style="padding:8px 10px;" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('edit-ingredients').appendChild(div);
  }

  function addStepRow(text = '', timer = '') {
    const div = document.createElement('div');
    div.className = 'row-item';
    div.innerHTML = `
      <input type="text" class="step-text" placeholder="Описание шага..." value="${escapeHtml(text)}" required style="flex:3;" />
      <input type="number" class="step-timer" placeholder="Сек." value="${timer}" min="0" style="width:76px;" />
      <button type="button" class="btn-danger" style="padding:8px 10px;" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('edit-steps').appendChild(div);
  }

  function saveRecipe(e) {
    e.preventDefault();
    const id = document.getElementById('edit-id').value || 'rec_' + Date.now();
    const existing = recipes.find(r => r.id === id);

    const ingredients = Array.from(document.querySelectorAll('#edit-ingredients .row-item')).map(row => ({
      name: row.querySelector('.ing-name').value.trim(),
      amount: row.querySelector('.ing-amount').value.trim()
    }));

    const steps = Array.from(document.querySelectorAll('#edit-steps .row-item')).map(row => ({
      text: row.querySelector('.step-text').value.trim(),
      timer: Number(row.querySelector('.step-timer').value) || 0
    }));

    const recipeObj = {
      id,
      title: document.getElementById('edit-title').value.trim(),
      category: document.getElementById('edit-category').value,
      time: Number(document.getElementById('edit-time').value) || 15,
      favorite: existing ? existing.favorite : false,
      kbju: {
        kcal: Number(document.getElementById('edit-kcal').value) || 0,
        prot: Number(document.getElementById('edit-prot').value) || 0,
        fat: Number(document.getElementById('edit-fat').value) || 0,
        carb: Number(document.getElementById('edit-carb').value) || 0
      },
      ingredients,
      steps
    };

    if (existing) {
      const idx = recipes.findIndex(r => r.id === id);
      recipes[idx] = recipeObj;
    } else {
      recipes.unshift(recipeObj);
    }

    saveState();
    closeModal('edit-modal');
    renderCurrentTab();
  }

  function deleteRecipe(id) {
    if (!confirm('Удалить этот рецепт?')) return;
    recipes = recipes.filter(r => r.id !== id);
    plannerIds = plannerIds.filter(pid => pid !== id);
    saveState();
    closeModal('view-modal');
    renderCurrentTab();
  }

  function openBackupModal() {
    document.getElementById('json-textarea').value = JSON.stringify(recipes, null, 2);
    document.getElementById('backup-modal').classList.add('open');
  }

  function exportJSONFile() {
    const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'recipes.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function copyJSONText() {
    const text = JSON.stringify(recipes, null, 2);
    navigator.clipboard.writeText(text).then(() => alert('JSON скопирован в буфер обмена!'));
  }

  function importJSONFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('json-textarea').value = ev.target.result;
      importJSONText(true);
    };
    reader.readAsText(file);
  }

  function importJSONText(merge) {
    try {
      const parsed = JSON.parse(document.getElementById('json-textarea').value.trim());
      if (!Array.isArray(parsed)) throw new Error('Ожидается массив рецептов');

      if (merge) {
        parsed.forEach(item => {
          const idx = recipes.findIndex(r => r.id === item.id || r.title === item.title);
          if (idx >= 0) recipes[idx] = item;
          else recipes.push(item);
        });
      } else {
        recipes = parsed;
      }

      saveState();
      closeModal('backup-modal');
      renderCurrentTab();
      alert(`Готово! Загружено рецептов: ${parsed.length}`);
    } catch (err) {
      alert('Ошибка формата JSON: ' + err.message);
    }
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  loadState();
  renderCurrentTab();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
